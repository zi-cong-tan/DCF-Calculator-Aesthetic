name: Refresh company data

# Weeknights after the US close: SEC filings, last close and the 10-year Treasury for the S&P 500.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_data.py
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m "Refresh company data $(date -u +%F)" && git push)
